name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar se o arquivo HTML existe
        run: |
          if [ -f site/index.html ]; then
            echo "Sucesso: Arquivo HTML encontrado!"
          else
            echo "Erro: Arquivo HTML não encontrado!"
            exit 1
          fi

      - name: Gerar Artefato do site
        uses: actions/upload-artifact@v4
        with:
          name: site-artifact
          path: site/
