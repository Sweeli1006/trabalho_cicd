<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Trabalho CI/CD</title>
</head>
<body>
    <h1>Meu primeiro deploy automatizado</h1>
    <p>Pipeline de CI/CD configurado com sucesso usando GitHub Actions!</p>
</body>
</html>name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar se o arquivo HTML existe
        run: |
          if [ -f site/index.html ]; then
            echo "Sucesso: Arquivo HTML encontrado!"
          else
            echo "Erro: Arquivo HTML não encontrado!"
            exit 1
          fi

      - name: Gerar Artefato do site
        uses: actions/upload-artifact@v4
        with:
          name: site-artifact
          path: site/